name: GRIZZLY production deploy

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'public/**'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grizzly-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          grep -Fxq 'name = "famaly"' wrangler.toml
          grep -Fxq 'database_name = "grizzly-db"' wrangler.toml
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Validate and run full test suite
        run: |
          node --check worker/index.js
          node --check public/app.js
          npm test
      - name: Deploy production Worker (no D1 migration)
        run: npx wrangler deploy
      - name: Public health check (Worker and custom domain)
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 4 \
            https://famaly.crowskick4133.workers.dev/api/health \
            | grep -q '"ok":true'
          curl --fail --silent --show-error --retry 5 --retry-delay 4 \
            https://grizzly-family.online/api/health \
            | grep -q '"ok":true'
          curl --fail --silent --show-error --retry 5 --retry-delay 4 \
            https://grizzly-family.online/about/ \
            | grep -q 'ІСТОРІЯ GRIZZLY'
          curl --fail --silent --show-error --retry 5 --retry-delay 4 \
            -o /dev/null https://grizzly-family.online/grizzly-social.png
          echo 'GRIZZLY Worker and public custom domain serve v8 content.'
