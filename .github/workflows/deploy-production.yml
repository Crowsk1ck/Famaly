name: GRIZZLY production deploy

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'public/**'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grizzly-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          grep -Fxq 'name = "famaly"' wrangler.toml
          grep -Fxq 'database_name = "grizzly-db"' wrangler.toml
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Validate and run full test suite
        run: |
          node --check worker/index.js
          node --check public/app.js
          npm test
      - name: Deploy production Worker (no D1 migration)
        run: npx wrangler deploy
      - name: Verify Worker and GRIZZLY production domain
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local label="$1" url="$2" pattern="$3" attempt code
            for attempt in $(seq 1 12); do
              code=$(curl --silent --show-error --location --max-time 15 \
                --output /tmp/grizzly-response --write-out '%{http_code}' "$url" || true)
              if [[ "$code" == "200" ]] && grep -Fq "$pattern" /tmp/grizzly-response; then
                echo "::notice::$label OK (HTTP $code)"
                return 0
              fi
              echo "$label: attempt $attempt/12 returned HTTP $code or missing expected marker"
              sleep 5
            done
            echo "::error::$label failed for $url (HTTP $code)"
            return 1
          }
          check "Worker health" "https://famaly.crowskick4133.workers.dev/api/health" '"ok":true'
          check "Domain health" "https://grizzly-family.online/api/health" '"ok":true'
          check "Domain v8 page" "https://grizzly-family.online/about/" 'ІСТОРІЯ GRIZZLY'
          preview_code=$(curl --silent --show-error --location --output /tmp/grizzly-preview --write-out '%{http_code}' https://grizzly-family.online/grizzly-social.png)
          [[ "$preview_code" == "200" ]] && [[ "$(od -An -tx1 -N8 /tmp/grizzly-preview | tr -d ' \\n')" == "89504e470d0a1a0a" ]] || { echo "::error::GRIZZLY PNG preview missing or invalid (HTTP $preview_code)"; exit 1; }
