name: Verify Grizzly
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax validation
        run: |
          node --check worker/index.js
          node --check public/app.js
          node --check public/credential-generator.js
      - name: Integration and generator tests
        run: npm test

      - name: Inspect live public page assets (read-only)
        shell: bash
        run: |
          for path in /join/ /app.js /credential-generator.js /style.css /api/public /api/auth/me; do
            echo "::group::GET $path"
            curl --silent --show-error --max-time 20 --dump-header /tmp/gr-headers --output /tmp/gr-body --write-out 'HTTP %{http_code}, content-type=%{content_type}, bytes=%{size_download}\n' "https://grizzly-family.online$path" || true
            grep -iE '^(HTTP/|content-type:|location:|cache-control:|content-security-policy:|x-grizzly-seo-route:)' /tmp/gr-headers || true
            printf 'First bytes: '; head -c 115 /tmp/gr-body | tr '\n' ' '; echo
            echo "::endgroup::"
          done

      - name: Browser diagnostic on live public tabs
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund puppeteer-core
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          const chrome=process.env.CHROME_BIN || '/usr/bin/google-chrome';
          const browser=await puppeteer.launch({executablePath:chrome,headless:true,args:['--no-sandbox']});
          const page=await browser.newPage();
          page.on('pageerror',e=>console.log('PAGE ERROR',e.stack||e.message));
          page.on('console',m=>{if(m.type()==='error')console.log('CONSOLE ERROR',m.text())});
          page.on('requestfailed',r=>console.log('FAILED REQUEST',r.url(),r.failure()?.errorText));
          for(const path of ['/join/','/about/','/gallery/']){
            const response=await page.goto('https://grizzly-family.online'+path,{waitUntil:'networkidle2',timeout:30000});
            await new Promise(r=>setTimeout(r,700));
            console.log('BROWSER',path,'HTTP',response.status(),'APP',await page.$eval('#app',el=>el.textContent.slice(0,250)),'MAIN',await page.$('#gr-main')!==null);
          }
          await browser.close();
          NODE
