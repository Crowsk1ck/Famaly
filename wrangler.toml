name = "famaly"
main = "worker/index.js"
compatibility_date = "2026-11-12"
workers_dev = true

# Publish this Worker on the real GRIZZLY domain, not only workers.dev.
# Cloudflare must own an active zone for this hostname.
[[routes]]
pattern = "grizzly-family.online"
custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/about/*", "/news/*", "/gallery/*", "/achievements/*", "/calendar/*", "/join/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "grizzly-db"
database_id = "22bfd811-aa30-4eba-bc72-2418ef7fedd4"
migrations_dir = "migrations"
